name: Extract ZIP, Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No .zip file found in the repo root"; exit 1
          fi
          echo "Extracting $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found inside the zip"; exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project folder: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android licenses (backup)
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" RedButton.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedButton-apk
          path: RedButton.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: RedButton.apk
