name: Extract ZIP, Build and Release PC App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          $zip = Get-ChildItem -Path . -Filter "RedButtonPC*.zip" | Select-Object -First 1
          if (-not $zip) { $zip = Get-ChildItem -Path . -Filter "*.zip" | Select-Object -First 1 }
          if (-not $zip) { Write-Error "No .zip file found in the repo root"; exit 1 }
          Write-Host "Extracting $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force
          $settings = Get-ChildItem -Path extracted -Recurse -Include "settings.gradle","settings.gradle.kts" | Select-Object -First 1
          if (-not $settings) { Write-Error "No settings.gradle found inside the zip"; exit 1 }
          $projectDir = $settings.DirectoryName
          Write-Host "Project folder: $projectDir"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build runnable JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle jar --stacktrace

      - name: Package Windows app (bundled Java, no install needed)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          jpackage --type app-image `
            --name RedButton `
            --input build/libs `
            --main-jar RedButton-PC.jar `
            --main-class com.example.redbutton.MainKt `
            --dest build/installer `
            --icon packaging/app.ico `
            --app-version "1.0.${{ github.run_number }}" `
            --add-modules "java.base,java.desktop,java.logging,java.management,java.naming,java.xml,java.sql,java.prefs,jdk.unsupported" `
            --java-options "-Xmx512m"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect release files
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "$env:PROJECT_DIR/build/libs/RedButton-PC.jar" "release/RedButton-PC.jar"
          Compress-Archive -Path "$env:PROJECT_DIR/build/installer/RedButton" -DestinationPath "release/RedButton-Windows.zip" -Force
          Get-ChildItem release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RedButton-PC
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            release/RedButton-Windows.zip
            release/RedButton-PC.jar
